services:
  postgres:
    image: postgres:16-alpine
    container_name: drogamar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drogamar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drogamar}
      POSTGRES_DB: ${POSTGRES_DB:-drogamar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drogamar} -d ${POSTGRES_DB:-drogamar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - drogamar-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: drogamar-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-drogamar}:${POSTGRES_PASSWORD:-drogamar}@postgres:5432/${POSTGRES_DB:-drogamar}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-prod-32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod-32}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_REFRESH_REMEMBER_EXPIRES_IN: ${JWT_REFRESH_REMEMBER_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@drogamar.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMeNow!123}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      EXPORT_STORAGE_PATH: /app/apps/backend/storage/exports
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-7}
      EXPORT_MAX_RECORDS: ${EXPORT_MAX_RECORDS:-50000}
      EXPORT_SYNC_THRESHOLD: ${EXPORT_SYNC_THRESHOLD:-1000}
      EXPORT_MAX_CONCURRENT_PER_USER: ${EXPORT_MAX_CONCURRENT_PER_USER:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - exports_data:/app/apps/backend/storage/exports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - drogamar-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: drogamar-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - drogamar-network

volumes:
  postgres_data:
  exports_data:

networks:
  drogamar-network:
    driver: bridge
