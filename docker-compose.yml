services:
  postgres:
    image: postgres:16-alpine
    container_name: drogamar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drogamar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drogamar}
      POSTGRES_DB: ${POSTGRES_DB:-drogamar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drogamar} -d ${POSTGRES_DB:-drogamar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - drogamar-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: drogamar-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-drogamar}:${POSTGRES_PASSWORD:-drogamar}@postgres:5432/${POSTGRES_DB:-drogamar}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - drogamar-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: drogamar-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - drogamar-network

volumes:
  postgres_data:

networks:
  drogamar-network:
    driver: bridge
